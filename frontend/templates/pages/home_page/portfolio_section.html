{% load wagtailcore_tags %}
{% comment %} djlint:off {% endcomment %}
<section class="py-16">
  <div class="container">
    <div>
      <h2 class="text-2xl md:text-4xl font-black">
        <a href="{% slugurl 'portfolio' %}" class="link link-primary no-underline">Architecture In Practice <svg xmlns="http://www.w3.org/2000/svg" class="inline size-4 md:size-8" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h16m0 0l-6-6m6 6l-6 6"/></svg></a>
      </h2>
      <p class="md:text-lg text-base-content">Concrete implementations backend systems, tooling, and infrastructure</p>
    </div>
    <div class="divide-y divide-base-300">
      {% for post in posts %}
        <div class="py-4">
          <h2 class="text-2xl font-bold"><a href="{% slugurl post.slug %}">{{ post.title }}</a></h2>
          <p class="text-base-content/90 mb-4">{{ post.excerpt }}</p>
          <a href="{% slugurl post.slug %}" class="link link-primary">Read More...</a>
        </div>
      {% endfor %}
    </div>
  </div>
</section>

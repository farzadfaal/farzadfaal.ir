{% load static django_vite %}
{% comment %} djlint:off {% endcomment %}
<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %}</title>
    {% vite_hmr_client %}
    {% vite_asset 'js/main.js' %}
    <meta name="keywords" content="" />
    <meta name="description"
          content="{% block description %}{% endblock description %}" />
    <meta property="og:title" content="">
    <meta property="og:type" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:alt" content="">
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any" />
    <link rel="icon" href="{% static 'icon.svg' %}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{% static 'icon.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@1,14..32,100..900&display=swap"
          rel="stylesheet">
    <link rel="manifest" href="{% static 'site.webmanifest' %}" />
    <meta name="theme-color" content="#fafafa" />
  </head>
  <body class="antialiased min-h-svh flex flex-col {% block body_class %}{% endblock body_class %}">
    {% include "includes/header.html" %}
    <main class="grow {% block main_class %}{% endblock main_class %}">{% block body %}{% endblock body %}</main>
    {% include "includes/footer.html" %}
  </body>
</html>
